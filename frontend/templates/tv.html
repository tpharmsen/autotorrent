<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TV Show Details</title>
    <link rel="stylesheet" href="/styles/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
</head>
<body>
    <a class="back" href="/">&larr; Back</a>
    <div id="tv-detail">
        </div>
    <h2>Seasons & Episodes</h2>
    <div class="episode-selectors">
        <select id="season-select">
            <option value="" disabled selected>Select Season</option>
            </select>
        <select id="episode-select">
            <option value="" disabled selected>Select Episode</option>
            </select>
        <button id="submit-request-btn" class="submit-btn">Search</button>
    </div>
    <div id="episode-detail">
        </div>
    <div class="progress-overlay" id="overlay">
		<div class="progress-card">
			<p class="progress-title">Buffering torrent</p>
			<p class="progress-name" id="prog-name"></p>
			<div class="progress-track">
				<div class="progress-fill" id="prog-fill"></div>
			</div>
			<div class="progress-meta">
				<span id="prog-bytes"></span>
				<span id="prog-pct"></span>
			</div>
			<p class="progress-status" id="prog-status">Downloading — please wait...</p>
		</div>
	</div>
	<div class="player-wrap" id="player-wrap">
		<p class="player-title" id="player-title"></p>
		<video id="video-player" controls autoplay playsinline></video>
		<p class="subtitle-info" id="subtitle-info"></p>
	</div>

    <h2>Torrents</h2>
        <div id="torrent-list">
            </div>
    <script type="module" src="/static/tv-page.js"></script>
</body>
</html>
