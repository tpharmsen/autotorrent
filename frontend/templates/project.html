<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Project Assistant</title>
	<link rel="stylesheet" href="/styles/styles.css">
</head>

<body>
	<a class="back" href="/">&larr; Back</a>
	<h1>Project Assistant</h1>

	<section class="chatbot" aria-labelledby="chatbot-title">
		<h2 id="chatbot-title">Local Assistant</h2>
		<p class="chatbot-note">The assistant works in /home/tpharmsen/Documents/flowbench-cnn and asks for command confirmation in the conversation.</p>
		<div id="chat-messages" class="chat-messages" aria-live="polite"></div>
		<label>Access token <input id="chat-token" type="password" autocomplete="off"></label>
		<label>Message <textarea id="chat-message" rows="3" placeholder="Ask about the workspace..."></textarea></label>
		<button id="chat-send" type="button">Send</button>
	</section>

    <div style="display: flex; justify-content: center; align-items: center;">
		<img
			src="https://baskargroup.bitbucket.io/static/media/Poster.5e9930fdd5ce35315d33.png"
			alt="Some description"
			style="width: 1200px; height: auto; background-color: #004170;"
		>
	</div>

	<div style="display: flex; justify-content: center; align-items: center;">
		<img
			src="https://media.licdn.com/dms/image/v2/D4E03AQG1UNm1MRnfrg/profile-displayphoto-scale_400_400/B4EZlTLZkbKsA0-/0/1758037122356?e=1790208000&v=beta&t=ezMfprokpbcLPbpfH1-RdpoarcoisvgPRuu8XgxcA7c"
			alt="tralala"
			style="width: 300px; height: auto; background-color: #0e2d43;"
		>
	</div>


	<script type="module" src="/static/project-page.js"></script>
</body>

</html>
