<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Project Assistant</title>
	<link rel="stylesheet" href="/styles/styles.css">
</head>

<body>
	<a class="back" href="/">&larr; Back</a>
	<h1>Project Assistant</h1>

	<section class="project-figures">
		<h2>Steady State Approximator</h2>
		<div style="display: flex; justify-content: center; align-items: center; margin-bottom: 40px;">
			<img
				src="/project-assets/flowbenchdataviz.png"
				alt="FlowBench data visualization"
				style="width: 1200px; height: auto;"
			>
		</div>
	</section>

	<section class="chatbot" aria-labelledby="chatbot-title">
		<h2 id="chatbot-title">Local Agent</h2>
		<div id="chat-messages" class="chat-messages" aria-live="polite"></div>
		<label>Access token <input id="chat-token" type="password" autocomplete="off"></label>
		<label>Message</label>
		<div class="chat-compose">
			<textarea id="chat-message" rows="3" placeholder="Ask about the workspace..."></textarea>
			<button id="chat-send" type="button">Send</button>
		</div>
		<button id="chat-reset" class="chat-reset" type="button">Reset agent</button>
	</section>

	<section class="project-figures" aria-labelledby="project-figures-title">
		<h2 id="project-figures-title">Agent figure output</h2>
		<div id="project-figure"></div>
	</section>

	<script type="module" src="/static/project-page.js"></script>
</body>

</html>
