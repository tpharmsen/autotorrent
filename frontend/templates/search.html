<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Movies</title>
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>

  <div class="list" id="search-results">

  <script type="module" src="/static/search.js"></script>
</body>
</html>
