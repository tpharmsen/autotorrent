<!DOCTYPE html>
<html>
<head>
<title>Search Movies</title>
<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}
h1 {
    text-align: center;
}
.search-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px auto 30px auto;
    max-width: 700px;
}
.search-container input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #222;
    color: white;
    font-size: 16px;
}
.search-container input:focus {
    outline: none;
    border-color: #e91e63;
}
.search-container button {
    background: #e91e63;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.15s;
}
.search-container button:hover {
    background: #c2185b;
}
.list {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.list-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #1c1c1c;
    border-radius: 8px;
    padding: 10px 14px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s;
}
.list-item:hover {
    background: #2a2a2a;
}
.list-item img {
    width: 42px;
    height: 63px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
}
.placeholder {
    width: 42px;
    height: 63px;
    background: #333;
    border-radius: 4px;
    flex-shrink: 0;
}
.info {
    flex: 1;
}
.info .title {
    font-size: 15px;
    font-weight: bold;
}
.info .year {
    font-size: 12px;
    color: #888;
    margin-top: 3px;
}
.arrow {
    color: #555;
    font-size: 20px;
}
.empty {
    text-align: center;
    color: #555;
    margin-top: 40px;
    font-size: 14px;
}
</style>
</head>
<body>
<h1>🎬 Search Movies</h1>
<div class="search-container">
    <input
        id="query"
        type="text"
        placeholder="Search for a movie..."
        onkeydown="if(event.key==='Enter') submitSearch()"
    >
    <button onclick="submitSearch()">Search</button>
</div>

<div class="list">
    {% if movies %}
        {% for movie in movies %}
        <a class="list-item" href="/movie/{{ movie.title | urlencode }}">
            {% if movie.poster_path %}
            <img src="https://image.tmdb.org/t/p/w185{{ movie.poster_path }}" alt="">
            {% else %}
            <div class="placeholder"></div>
            {% endif %}
            <div class="info">
                <div class="title">{{ movie.title or movie.name }}</div>
                <div class="year">{{ (movie.release_date or '')[:4] }}</div>
            </div>
            <span class="arrow">›</span>
        </a>
        {% endfor %}
    {% else %}
        <div class="empty">No results found.</div>
    {% endif %}
</div>

<script>
function submitSearch() {
    const query = document.getElementById("query").value.trim();
    if (!query) return;
    window.location.href = `/search/${encodeURIComponent(query)}`;
}
</script>
</body>
</html>
