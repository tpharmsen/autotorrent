<!DOCTYPE html>
<html>
<head>
    <title>Torrent Receiver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>📥 Torrent Receiver</h1>
        <div class="subtitle">Send magnet links from your phone</div>

        <form id="torrentForm">
            <textarea id="link" rows="3" placeholder="magnet:?xt=urn:btih:..."></textarea>
            <button type="submit">Download Torrent</button>
        </form>

        <div id="result"></div>
        <div class="info">
            <p>📱 Phone access:</p>
            <code>curl -X POST http://{{ ip }}:5000/add -H "Content-Type: application/json" -d '{"link":"magnet:..."}'</code>
        </div>
    </div>

    <script>
        const form = document.getElementById('torrentForm');
        const linkInput = document.getElementById('link');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const link = linkInput.value.trim();

            if (!link) {
                resultDiv.innerHTML = '<div class="error">❌ Please enter a torrent link</div>';
                return;
            }

            if (!link.startsWith('magnet:')) {
                resultDiv.innerHTML = '<div class="error">❌ Invalid magnet link (must start with magnet:)</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">⏳ Adding torrent...</div>';

            try {
                const response = await fetch('/add-and-play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({link: link})
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">✅ ' + data.message + '</div>';
                    linkInput.value = '';
                    // Clear success message after 3 seconds
                    setTimeout(() => {
                        if (resultDiv.innerHTML.includes('success')) {
                            resultDiv.innerHTML = '';
                        }
                    }, 3000);
                } else {
                    resultDiv.innerHTML = '<div class="error">❌ ' + data.detail + '</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<div class="error">❌ Connection error: ' + error.message + '</div>';
            }
        });

        // Allow Ctrl+Enter to submit
        linkInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // Auto-focus on page load
        linkInput.focus();
    </script>
</body>
</html>
