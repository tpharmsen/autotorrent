<!DOCTYPE html>
<html>
<head>
<title>Movie Posters</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<h1>🎬 Movie Posters</h1>

<div class="search-container">
  <input type="text" id="movie-search" placeholder="Search for a movie...">
  <button id="search-btn">Search</button>
</div>

<div class="grid">
  {% for poster in posters %}
  <a href="/movie/{{ poster.rsplit('.', 1)[0] }}">
    <div class="card">
      <img src="/posters/{{ poster }}" alt="{{ poster }}">
    </div>
  </a>
  {% endfor %}
</div>

<div class="wipe-container">
  <button id="wipe-btn">Wipe Cache</button>
</div>

<script src="/static/js/client.js"></script>
</body>
</html>
